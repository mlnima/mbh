name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_base:
        description: 'Where is the site served from? Empty = repository project site under /mbh/. For a custom domain at the domain root, enter "."'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No npm cache here: the repo's .npmrc would need to be present
          # before setup-node computes the cache key, and the cache post
          # step fails the job when the path is missing. Builds are fast
          # enough without it.

      # Custom domain at the domain root ("/", "/partnership.php") when
      # site_base is "."; empty keeps the repository project site
      # ("/mbh/", "/mbh/partnership.php").
      - name: Select deploy base
        run: |
          if [ "${{ github.event.inputs.site_base }}" = "." ]; then
            echo "VITE_BASE=." >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.site_base }}" ]; then
            echo "VITE_BASE=${{ github.event.inputs.site_base }}" >> "$GITHUB_ENV"
          else
            echo "GITHUB_PAGES=true" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        env:
          GITHUB_PAGES: ${{ env.GITHUB_PAGES }}
        with:
          # Create the Pages site (GitHub Actions as source) if the
          # repository has not enabled Pages yet.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
