name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_base:
        description: 'Where is the site served from? Empty = repository project site under /mbh/. For a custom domain at the domain root, enter "."'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Custom domain at the domain root ("/", "/partnership.php") when
      # site_base is "."; empty keeps the repository project site ("/mbh/",
      # "/mbh/partnership.php").
      GITHUB_PAGES: ${{ github.event.inputs.site_base == '' && 'true' || '' }}
      VITE_BASE: ${{ github.event.inputs.site_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site (with GitHub Actions as source) if the
          # repository has not enabled Pages yet.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
