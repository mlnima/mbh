/* FIXED BOTTOM RIBBON */
.media-logo-ribbon {
  position: fixed;
  bottom: 0;
  left: 0;

  background: rgba(0, 0, 0, 0.9);
  padding: 6px 0;
  z-index: 9999;
  overflow: hidden;

.media-logo-track {
  display: inline-flex;
  align-items: center;
  gap: 40px;
  white-space: nowrap;

  /* WICHTIG: Endlos-Animation */
  animation: media-logo-scroll 45s linear infinite;
}

/* LOGO-STYLING */
.media-logo-ribbon img {
  height: 32px;
  max-width: 120px;
  object-fit: contain;
  filter: grayscale(100%);
  opacity: 0.8;
  transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
}

.media-logo-ribbon a {
  display: inline-flex;
  align-items: center;
}

.media-logo-ribbon img:hover {
  transform: scale(1.1);
  opacity: 1;
  filter: grayscale(0%);
}

/* DIE EIGENTLICHE ENDLOS-SCROLL-ANIMATION */
@keyframes media-logo-scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    /* da du die Logos 2x hintereinander hast,
       reicht -50%, um wieder "am Anfang" zu sein */
    transform: translateX(-50%);
  }
}

/* Optional: auf sehr kleinen Geräten etwas kleiner machen */
