<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mohsen Bahmani</title>
  <script>
    // GitHub Pages fallback for deep links (e.g. /mbh/partnership.php).
    // Pages serves this file on 404 and exposes the original path in
    // ?path=; forward it to the SPA, which restores the URL with
    // history.replaceState before the router reads it.
    var m = location.search.match(/[?&]path=([^&]+)/);
    var orig = m ? '/' + decodeURIComponent(m[1]).replace(/^\/+/, '') : '/';
    location.replace(
      location.pathname.replace(/\/404\.html$/, '/') +
        '?path=' + encodeURIComponent(orig),
    );
  </script>
</head>
<body></body>
</html>
